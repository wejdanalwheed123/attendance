<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>متابعة غياب الطالبات</title>
<style>
  :root {
    --bg: #FBFAF7;
    --card: #FFFFFF;
    --plum: #7C6A9C;
    --plumDark: #5B4B7A;
    --text: #443E54;
    --textSoft: #8A8296;
    --line: #EAE4F2;
    --lavender: #EFE7FA;
    --lavenderDark: #B9A6DE;
    --pink: #FCE7EE;
    --pinkDark: #E39BB4;
    --red: #F6D3D3;
    --redDark: #B94A4A;
    --yellow: #FBEBBE;
    --yellowDark: #92720B;
    --green: #DFF3EA;
    --greenDark: #4A8E72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  input, select, button, textarea { font-family: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--lavenderDark);
    outline-offset: 1px;
  }
  button { cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 60px; }
  .header {
    background: linear-gradient(135deg, var(--lavender) 0%, var(--pink) 100%);
    padding: 22px 20px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 880px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .header img { height: 56px; width: auto; flex-shrink: 0; }
  .eyebrow { font-size: 13px; color: var(--plumDark); font-weight: 600; opacity: .75; margin-bottom: 4px; }
  .header h1 { margin: 0; font-size: 26px; color: var(--plumDark); font-weight: 800; }
  .header .sub { font-size: 14px; color: var(--plumDark); opacity: .7; margin-top: 4px; }

  .tabbar { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .tabbtn {
    padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-weight: 700; font-size: 14px;
    transition: all .15s ease;
  }
  .tabbtn.active { border-color: var(--plum); background: var(--plum); color: #fff; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
  }
  .field-label { font-size: 12px; font-weight: 700; color: var(--plumDark); margin-bottom: 5px; }
  .input {
    padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line);
    font-size: 14px; color: var(--text); background: #fff;
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .btn-primary {
    padding: 9px 20px; border-radius: 9px; border: none; background: var(--plum);
    color: #fff; font-weight: 700; font-size: 14px;
  }
  .btn-outline {
    padding: 9px 18px; border-radius: 9px; border: 1px solid var(--plum); background: #fff;
    color: var(--plum); font-weight: 700; font-size: 13px;
  }
  .link-btn {
    background: none; border: none; color: var(--plum); font-size: 13px; font-weight: 700;
    text-decoration: underline; padding: 0;
  }

  .student-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 10px; border-radius: 10px; cursor: pointer; transition: background .15s ease;
  }
  .student-row .left { display: flex; align-items: center; gap: 10px; }
  .student-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--pinkDark); }
  .student-name { font-weight: 600; color: var(--text); }
  .student-class { font-size: 12px; color: var(--textSoft); }

  .empty { text-align: center; color: var(--textSoft); padding: 24px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: right; padding: 8px 10px; color: var(--plumDark); font-size: 12.5px; border-bottom: 2px solid var(--line); }
  td { text-align: right; padding: 10px 10px; color: var(--text); border-bottom: 1px solid var(--line); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
    border-radius: 999px; font-weight: 700; font-size: 12.5px;
  }
  .summary-pill {
    border-radius: 12px; padding: 10px 16px; display: flex; align-items: center;
    gap: 10px; flex: 1 1 200px;
  }
  .summary-pill .num { font-size: 24px; font-weight: 900; }
  .summary-pill .lbl { font-size: 12.5px; font-weight: 700; line-height: 1.3; }

  .roster-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px; border-bottom: 1px solid var(--line);
  }
  .del-btn { background: none; border: none; color: var(--redDark); font-size: 13px; font-weight: 700; }

  @media print {
    .no-print { display: none !important; }
    body { background: white; }
  }
</style>
</head>

<div class="wrap">
  <div class="tabbar no-print">
    <button class="tabbtn active" data-tab="log">تسجيل الغياب اليومي</button>
    <button class="tabbtn" data-tab="dashboard">لوحة المتابعة</button>
    <button class="tabbtn" data-tab="roster">قائمة الطالبات</button>
  </div>

  <div id="tab-log"></div>
  <div id="tab-dashboard" style="display:none;"></div>
  <div id="tab-roster" style="display:none;"></div>
</div>

<script>
// ---------------- Storage ----------------
function loadRoster() {
  try { return JSON.parse(localStorage.getItem('attendance_roster') || '[]'); }
  catch (e) { return []; }
}
function saveRoster(v) { localStorage.setItem('attendance_roster', JSON.stringify(v)); }
function loadAbsences() {
  try { return JSON.parse(localStorage.getItem('attendance_absences') || '[]'); }
  catch (e) { return []; }
}
function saveAbsences(v) { localStorage.setItem('attendance_absences', JSON.stringify(v)); }

let students = loadRoster();
let absences = loadAbsences();

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

// ---------------- date helpers ----------------
function todayStr() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
}
function monthOf(dateStr) { return dateStr ? dateStr.slice(0, 7) : ''; }
function thisMonthStr() { return todayStr().slice(0, 7); }

const WEEKDAY_AR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function formatDateAr(dateStr) {
  if (!dateStr) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${WEEKDAY_AR[dt.getDay()]} ${d} ${MONTHS_AR[m-1]} ${y}`;
}
function formatMonthAr(monthKey) {
  if (!monthKey) return '';
  const [y,m] = monthKey.split('-').map(Number);
  return `${MONTHS_AR[m-1]} ${y}`;
}
function statusFor(count) {
  if (count >= 5) return { label: 'بحاجة لإجراء', bg: 'var(--red)', fg: 'var(--redDark)' };
  if (count >= 3) return { label: 'بحاجة لمتابعة', bg: 'var(--yellow)', fg: 'var(--yellowDark)' };
  return { label: 'منتظمة', bg: 'var(--green)', fg: 'var(--greenDark)' };
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getClasses() {
  return Array.from(new Set(students.map(s => s.className).filter(Boolean))).sort();
}

// ---------------- Tabs ----------------
document.querySelectorAll('.tabbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-log').style.display = tab === 'log' ? '' : 'none';
    document.getElementById('tab-dashboard').style.display = tab === 'dashboard' ? '' : 'none';
    document.getElementById('tab-roster').style.display = tab === 'roster' ? '' : 'none';
    if (tab === 'dashboard') renderDashboard();
    if (tab === 'roster') renderRoster();
    if (tab === 'log') renderLog();
  });
});

// ================= LOG TAB =================
let logState = { date: todayStr(), classFilter: '', query: '' };

function renderLog() {
  const el = document.getElementById('tab-log');
  if (students.length === 0) {
    el.innerHTML = `<div class="card empty">ما فيه طالبات مضافة بعد. روحي لتبويب <b>«قائمة الطالبات»</b> وضيفي الأسماء أول شي.</div>`;
    return;
  }
  const absentIdsToday = new Set(absences.filter(a => a.date === logState.date).map(a => a.studentId));
  const classes = getClasses();

  const visible = students.filter(s => {
    if (logState.classFilter && s.className !== logState.classFilter) return false;
    if (logState.query && !s.name.includes(logState.query)) return false;
    return true;
  });

  el.innerHTML = `
    <div class="card">
      <div class="row">
        <div>
          <div class="field-label">التاريخ</div>
          <input class="input" type="date" id="logDate" style="width:160px" value="${logState.date}" />
        </div>
        <div>
          <div class="field-label">الصف</div>
          <select class="input" id="logClassFilter" style="width:150px">
            <option value="">كل الصفوف</option>
            ${classes.map(c => `<option value="${escapeHtml(c)}" ${c===logState.classFilter?'selected':''}>${escapeHtml(c)}</option>`).join('')}
          </select>
        </div>
        <div style="flex:1;min-width:160px">
          <div class="field-label">بحث بالاسم</div>
          <input class="input" type="text" id="logQuery" style="width:100%" placeholder="اكتبي اسم الطالبة..." value="${escapeHtml(logState.query)}" />
        </div>
      </div>
      <div style="margin-top:12px;font-size:13px;color:var(--plumDark);font-weight:700">
        ${formatDateAr(logState.date)} — عدد الغائبات المسجّلات: ${absentIdsToday.size}
      </div>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--textSoft);margin-bottom:10px">حطي علامة ✓ أمام كل طالبة غايبة اليوم — يُحفظ تلقائيًا</div>
      <div id="logStudentList" style="display:flex;flex-direction:column;gap:2px">
        ${visible.length === 0 ? '<div class="empty">لا توجد نتائج مطابقة</div>' : visible.map(s => {
          const isAbsent = absentIdsToday.has(s.id);
          return `
          <label class="student-row" data-id="${s.id}" style="background:${isAbsent ? 'var(--pink)' : 'transparent'}">
            <span class="left">
              <input type="checkbox" ${isAbsent ? 'checked' : ''} />
              <span class="student-name">${escapeHtml(s.name)}</span>
            </span>
            ${s.className ? `<span class="student-class">${escapeHtml(s.className)}</span>` : ''}
          </label>`;
        }).join('')}
      </div>
    </div>
  `;

  document.getElementById('logDate').addEventListener('change', e => { logState.date = e.target.value; renderLog(); });
  document.getElementById('logClassFilter').addEventListener('change', e => { logState.classFilter = e.target.value; renderLog(); });
  document.getElementById('logQuery').addEventListener('input', e => { logState.query = e.target.value; renderLog(); });

  document.querySelectorAll('#logStudentList .student-row').forEach(row => {
    row.addEventListener('click', (e) => {
      e.preventDefault();
      const studentId = row.dataset.id;
      const exists = absences.find(a => a.date === logState.date && a.studentId === studentId);
      if (exists) {
        absences = absences.filter(a => a.id !== exists.id);
      } else {
        absences.push({ id: uid(), studentId, date: logState.date });
      }
      saveAbsences(absences);
      renderLog();
    });
  });
}

// ================= DASHBOARD TAB =================
let dashState = { month: thisMonthStr(), classFilter: '' };

function renderDashboard() {
  const el = document.getElementById('tab-dashboard');
  const classes = getClasses();

  const rows = students
    .filter(s => !dashState.classFilter || s.className === dashState.classFilter)
    .map(s => {
      const count = absences.filter(a => a.studentId === s.id && monthOf(a.date) === dashState.month).length;
      return { ...s, count };
    })
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ar'));

  const needAction = rows.filter(r => r.count >= 5).length;
  const needFollowUp = rows.filter(r => r.count >= 3 && r.count < 5).length;
  const regular = rows.length - needAction - needFollowUp;

  el.innerHTML = `
    <div class="card">
      <div class="row no-print" style="margin-bottom:16px">
        <div>
          <div class="field-label">الشهر</div>
          <input class="input" type="month" id="dashMonth" style="width:160px" value="${dashState.month}" />
        </div>
        <div>
          <div class="field-label">الصف</div>
          <select class="input" id="dashClassFilter" style="width:150px">
            <option value="">كل الصفوف</option>
            ${classes.map(c => `<option value="${escapeHtml(c)}" ${c===dashState.classFilter?'selected':''}>${escapeHtml(c)}</option>`).join('')}
          </select>
        </div>
        <div style="flex:1"></div>
        <button class="btn-outline" id="printBtn">🖨️ طباعة الكشف</button>
      </div>
      <div style="font-size:15px;font-weight:800;color:var(--plumDark);margin-bottom:12px">كشف شهر ${formatMonthAr(dashState.month)}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="summary-pill" style="background:var(--red);color:var(--redDark)">
          <div class="num">${needAction}</div><div class="lbl">بحاجة لإجراء (٥ أيام فأكثر)</div>
        </div>
        <div class="summary-pill" style="background:var(--yellow);color:var(--yellowDark)">
          <div class="num">${needFollowUp}</div><div class="lbl">بحاجة لمتابعة (٣-٤ أيام)</div>
        </div>
        <div class="summary-pill" style="background:var(--green);color:var(--greenDark)">
          <div class="num">${regular}</div><div class="lbl">منتظمة (أقل من ٣)</div>
        </div>
      </div>
    </div>
    <div class="card">
      ${rows.length === 0 ? '<div class="empty">لا توجد بيانات لهذا الشهر</div>' : `
      <table>
        <thead><tr><th>الاسم</th><th>الصف</th><th>أيام الغياب</th><th>الحالة</th></tr></thead>
        <tbody>
          ${rows.map(r => {
            const st = statusFor(r.count);
            return `<tr>
              <td style="font-weight:700">${escapeHtml(r.name)}</td>
              <td>${escapeHtml(r.className || '—')}</td>
              <td><span style="font-weight:800;color:${st.fg}">${r.count}</span></td>
              <td><span class="pill" style="background:${st.bg};color:${st.fg}">${st.label}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  document.getElementById('dashMonth').addEventListener('change', e => { dashState.month = e.target.value; renderDashboard(); });
  document.getElementById('dashClassFilter').addEventListener('change', e => { dashState.classFilter = e.target.value; renderDashboard(); });
  document.getElementById('printBtn').addEventListener('click', () => window.print());
}

// ================= ROSTER TAB =================
function renderRoster() {
  const el = document.getElementById('tab-roster');
  el.innerHTML = `
    <div class="card">
      <div class="field-label">إضافة طالبة</div>
      <div class="row">
        <input class="input" type="text" id="rName" style="width:220px" placeholder="اسم الطالبة" />
        <input class="input" type="text" id="rClass" style="width:140px" placeholder="الصف (اختياري)" />
        <button class="btn-primary" id="rAddBtn">إضافة</button>
      </div>
      <button class="link-btn" id="rBulkToggle" style="margin-top:12px">إضافة عدة طالبات دفعة وحدة</button>
      <div id="rBulkArea" style="display:none;margin-top:10px">
        <div style="font-size:12.5px;color:var(--textSoft);margin-bottom:6px">الصقي كل اسم بسطر مستقل، وممكن تضيفين الصف بعد فاصلة — مثال: سارة أحمد، 1/1</div>
        <textarea class="input" id="rBulkText" rows="5" style="width:100%;resize:vertical" placeholder="سارة أحمد، 1/1
نوف خالد، 1/2
ريم سالم، 1/1"></textarea>
        <button class="btn-primary" id="rBulkAddBtn" style="margin-top:8px;padding:8px 18px;font-size:13px">إضافة الكل</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--textSoft);margin-bottom:10px">عدد الطالبات: ${students.length}</div>
      <div id="rList">
        ${students.length === 0 ? '<div class="empty">لا توجد طالبات مضافة بعد</div>' : students.map(s => `
          <div class="roster-row" data-id="${s.id}">
            <span style="font-weight:600">${escapeHtml(s.name)} ${s.className ? `<span style="font-size:12px;color:var(--textSoft);font-weight:400">(${escapeHtml(s.className)})</span>` : ''}</span>
            <button class="del-btn" data-id="${s.id}">حذف</button>
          </div>`).join('')}
      </div>
    </div>
  `;

  document.getElementById('rAddBtn').addEventListener('click', () => {
    const name = document.getElementById('rName').value.trim();
    const cls = document.getElementById('rClass').value.trim();
    if (!name) return;
    students.push({ id: uid(), name, className: cls });
    saveRoster(students);
    renderRoster();
  });
  ['rName','rClass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('rAddBtn').click();
    });
  });
  document.getElementById('rBulkToggle').addEventListener('click', () => {
    const area = document.getElementById('rBulkArea');
    area.style.display = area.style.display === 'none' ? '' : 'none';
  });
  document.getElementById('rBulkAddBtn').addEventListener('click', () => {
    const text = document.getElementById('rBulkText').value;
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const newOnes = lines.map(line => {
      const parts = line.split(/[-,،]/).map(p => p.trim());
      return { id: uid(), name: parts[0] || line, className: parts[1] || '' };
    });
    if (newOnes.length) {
      students = students.concat(newOnes);
      saveRoster(students);
      renderRoster();
    }
  });
  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      students = students.filter(s => s.id !== id);
      saveRoster(students);
      renderRoster();
    });
  });
}

// ---------------- init ----------------
renderLog();
</script>
